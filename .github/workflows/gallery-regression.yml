name: Gallery migration regression
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - name: Verify legacy visibility migration against Firestore
        run: npx firebase emulators:exec --config firebase.gallery-test.json --only firestore --project demo-mediprisma "node --test tests/prompt-visibility-migration.test.mjs"
